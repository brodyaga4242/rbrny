function makePdf(jpg, w, hgt){
  const PW = w > hgt ? 842 : 595, PH = w > hgt ? 595 : 842;
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const put = d => { const b = typeof d === "string" ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, head, bin) => { offs[n] = len; put(n + " 0 obj\n" + head); if (bin){ put(bin); put("\nendstream"); } put("\nendobj\n"); };
  put("%PDF-1.4\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  obj(4, "<< /Type /XObject /Subtype /Image /Width " + w + " /Height " + hgt + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.length + " >>\nstream\n", jpg);
  const cs = "q " + PW + " 0 0 " + PH + " 0 0 cm /Im0 Do Q";
  obj(5, "<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream");
  const x = len;
  let xr = "xref\n0 6\n0000000000 65535 f \n";
  for (let i = 1; i <= 5; i++) xr += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  put(xr + "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + x + "\n%%EOF");
  return new Blob(parts, {type: "application/pdf"});
}

function statsConfig(){

    if (tries++ < 2){ setTimeout(() => { im.src = src + (src.startsWith("data:") ? "" : (src.includes("?") ? "&" : "?") + "r=" + tries + Date.now()); }, 700 * tries); }

  return im;
}

/* ---------- хронология: ползунок по датам и «экранчик» события ---------- */
let tlSel = 0, tlList = false;
const tlNum = d => { const m = /-?\d+(?:[.,]\d+)?/.exec(String(d || "")); return m ? parseFloat(m[0].replace(",", ".")) : NaN; };
/* если у всех событий есть числа (годы) и они растут, ставим события по масштабу, иначе поровну */
function tlPositions(A){
  const n = A.length; if (n < 2) return A.map(() => 0.5);
  const even = A.map((_, i) => i / (n - 1)), nums = A.map(x => tlNum(plain(x.date)));
  if (nums.some(v => !isFinite(v))) return even;
  const span = nums[n - 1] - nums[0]; if (!(span > 0)) return even;
  const pos = nums.map(v => (v - nums[0]) / span);
  for (let i = 1; i < n; i++) if (pos[i] - pos[i - 1] < 0.035) return even;
  return pos;
}
function viewTimelineList(A){
  return h("div", {}, A.length ? h("div", {class: "tl"}, A.map((c, i) => h("article", {class: "ev"},
      ed("div", {class: "dt"}, () => c.date, v => c.date = v, {ph: "Дата"}),
      ed("h3", {}, () => c.title, v => c.title = v, {ph: "Событие"}),
      ed("p", {}, () => c.text, v => c.text = v, {multi: true, ph: "Описание"}),
      rowTools(A, i)))) : h("div", {class: "empty"}, "События пока не добавлены."),
    addBtn("Добавить событие", () => A.push({date: "Дата", title: "Новое событие", text: "Описание."})));
}
function viewTimeline(){
  const A = C.timeline;

  const mode = h("div", {class: "tls-mode", role: "group", "aria-label": "Вид хронологии"}, [["Ползунок", false], ["Списком", true]].map(([nm, v]) =>
    h("button", {class: "imgbtn soft" + (tlList === v ? " on" : ""), type: "button", "aria-pressed": String(tlList === v), onclick: () => { tlList = v; render(); }}, nm)));
  if (tlList) return h("div", {}, head, mode, viewTimelineList(A));
  if (!A.length) return h("div", {}, head, h("div", {class: "empty"}, "События пока не добавлены."), addBtn("Добавить событие", () => { A.push({date: "Дата", title: "Новое событие", text: "Описание."}); tlSel = 0; }));

  track.append(h("i", {class: "tls-line"}), fillEl, ...ticks, thumb);

  const screen = h("div", {class: "tls-screen", "aria-live": "polite"});
  const drawScreen = () => {
    const c = A[tlSel], i = tlSel;
    const tools = editing ? h("div", {class: "rowtools", style: "margin-top:16px"},
      toolBtn("left", "", () => change(() => { if (i > 0){ move(A, i, -1); tlSel = i - 1; } }), "Сдвинуть раньше"),
      toolBtn("arrow", "", () => change(() => { if (i < A.length - 1){ move(A, i, 1); tlSel = i + 1; } }), "Сдвинуть позже"),

      ed("h3", {class: "tls-title"}, () => c.title, v => c.title = v, {ph: "Событие"}),
      ed("div", {class: "art-text tls-text"}, () => c.text, v => c.text = v, {multi: true, ph: "Описание события"}),
      h("div", {class: "tls-nav"},
        i > 0 ? h("button", {class: "art-back", type: "button", onclick: () => select(i - 1)}, "← " + (plain(A[i - 1].date) || "Раньше")) : h("span"),
        i < A.length - 1 ? h("button", {class: "art-back", type: "button", onclick: () => select(i + 1)}, (plain(A[i + 1].date) || "Позже") + " →") : h("span")),

  let drag = false;

  });
  /* если подписи дат не помещаются рядом (длинные слова на телефоне), показываем только подпись выбранной даты под линией */

}

/* ---------- «Скачать HTML»: файл сайта с текущими правками ---------- */
/* Картинки на сайте хранятся как ссылки на хранилище, поэтому в скачанный файл их вшиваем целиком */
let inlineFailed = 0;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
async function inlineAssets(node){
  const blobToUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
  /* запасной путь: песочница может запрещать fetch, но показывать картинки обычным тегом, поэтому перерисовываем её через canvas */
  const viaCanvas = id => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      try{
        const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
        const g = c.getContext("2d"); g.drawImage(im, 0, 0);
        let alpha = false;
        const px = g.getImageData(0, 0, c.width, c.height).data;
        for (let i = 3; i < px.length; i += 4 * 7) if (px[i] < 250){ alpha = true; break; }
        res(alpha ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.92));
      }catch(e){ rej(e); }
    };
    im.onerror = () => rej(new Error("img"));
    im.src = srcOf(id);
  });
  const cache = new Map();
  const fetchOne = id => {
    if (!cache.has(id)) cache.set(id,
      withTimeout(fetch("/_blob/" + id).then(r => { if (!r.ok) throw new Error("http " + r.status); return r.blob(); }).then(blobToUrl), 20000)
        .catch(() => withTimeout(viaCanvas(id), 15000)).catch(() => { inlineFailed++; return ""; }));
    return cache.get(id);
  };
  inlineFailed = 0;
  const jobs = [];
  (function walk(o){
    if (!o || typeof o !== "object") return;
    for (const k of Object.keys(o)){
      const v = o[k];
      if (typeof v === "string"){ if (isAsset(v)) jobs.push(fetchOne(v).then(u => { o[k] = u; })); }
      else walk(v);
    }
  })(node);
  await Promise.all(jobs);
  return node;
}
function exportHtml(content){
  content = content || C;
  /* строки собраны из частей, чтобы браузер не принял их за конец этого скрипта */
  const BEGIN = "<!" + "--RY:BEGIN--" + ">", CLOSE = "</" + "script>";
  const start = PRISTINE.indexOf(BEGIN), end = PRISTINE.lastIndexOf(CLOSE) + CLOSE.length;
  let body = PRISTINE.slice(start, end);
  const S = "/*DEFAULTS-" + "START*/", E = "/*DEFAULTS-" + "END*/";
  const i = body.indexOf(S), j = body.indexOf(E, i);
  if (start < 0 || i < 0 || j < 0) throw new Error("export markers missing");
  const json = JSON.stringify(content, null, 2).replace(/</g, "\\u003c").split(String.fromCharCode(0x2028)).join("\\" + "u2028").split(String.fromCharCode(0x2029)).join("\\" + "u2029");
  body = body.slice(0, i + S.length) + json + body.slice(j);
  return '<!DOCTYPE html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n</head>\n<body>\n' + body + '\n</body>\n</html>\n';
}
async function downloadHtml(){
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  let html;
  toast("Собираю файл вместе с картинками…");
  try{ html = exportHtml(await inlineAssets(clone(C))); }catch(e){ toast("Не получилось собрать файл: " + ((e && e.message) || e)); return; }
  const failedNote = inlineFailed ? " Не удалось вшить картинок: " + inlineFailed + "." : "";
  const fname = ((C.site.name || "site").replace(/[\\\/:*?"<>|]/g, "").trim() || "site") + ".html";
  if (window.claude && window.claude.use){

    if (!dl){ toast("В этом окне скачать файл нельзя. Откройте страницу по прямой ссылке."); return; }
    try{ await dl.save({filename: fname, data: new Blob([html], {type: "text/html"})}); toast("Файл сохранён. В нём все ваши правки." + failedNote); }
    catch(e){ toast(e && e.code === "declined" ? "Сохранение отменено." : "Не получилось сохранить файл" + (e && (e.code || e.message) ? " (" + (e.code || e.message) + ")" : "") + "."); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], {type: "text/html"})); a.download = fname;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Файл скачан. В нём все ваши правки." + failedNote);
}

function dataUrlToBlob(u){
  const m = /^data:([^;,]+)(;base64)?,([\s\S]*)$/.exec(u || "");
  if (!m) return null;
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
  const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type: m[1]});
}

      const i = text.indexOf(S), j = text.indexOf(E, i);

      const next = normalize(JSON.parse(text.slice(i + S.length, j)));

/* ---------- GitHub Pages: общий сайт и вход для админов ---------- */
/* Все видят content.json из репозитория. Админ входит словом «admin» в поиске (или ?edit в адресе), один раз вставляет токен GitHub,
   и правки записываются в репозиторий. Писать может только тот, у кого есть доступ к репозиторию. */
const GHKEY = "rebornY.github";
const GH_FILE = "content.json";
function ghGuess(){
  const m = /^([^.]+)\.github\.io$/i.exec(location.hostname), seg = location.pathname.split("/").filter(Boolean)[0];
  return m ? m[1] + "/" + (seg && !/\.html?$/i.test(seg) ? seg : m[1] + ".github.io") : "";
}
const ghB64 = str => { const b = new TextEncoder().encode(str); let r = ""; for (let i = 0; i < b.length; i += 8192) r += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(r); };

const ghUrl = () => "https://api.github.com/repos/" + ghCfg.repo + "/contents/" + GH_FILE;
async function ghSha(){
  const r = await fetch(ghUrl() + "?ref=" + encodeURIComponent(ghCfg.branch) + "&t=" + Date.now(), {headers: ghHeaders({"Accept": "application/vnd.github+json"}), cache: "no-store"});
  if (r.status === 404) return null;
  if (!r.ok) throw {code: r.status === 401 || r.status === 403 ? "not_granted" : "http", status: r.status};
  return (await r.json()).sha || null;
}
async function ghRead(){
  const r = await fetch(ghUrl() + "?ref=" + encodeURIComponent(ghCfg.branch) + "&t=" + Date.now(), {headers: ghHeaders({"Accept": "application/vnd.github.raw+json"}), cache: "no-store"});
  if (r.status === 404) return null;
  if (!r.ok) throw {code: r.status === 401 || r.status === 403 ? "not_granted" : "http", status: r.status};
  return r.json();
}
/* Картинка кладётся отдельным файлом в папку img/ репозитория, в content.json остаётся только путь */
async function ghUploadImage(blob){
  const ext = {"image/svg+xml": "svg", "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif"}[blob.type] || "webp";

  const b = new Uint8Array(await blob.arrayBuffer()); let bin = "";

  const r = await fetch("https://api.github.com/repos/" + ghCfg.repo + "/contents/" + path, {method: "PUT",
    headers: ghHeaders({"Accept": "application/vnd.github+json", "Content-Type": "application/json"}),
    body: JSON.stringify({message: "Картинка через редактор", content: btoa(bin), branch: ghCfg.branch})});
  if (!r.ok) throw {code: r.status === 401 || r.status === 403 || r.status === 404 ? "not_granted" : r.status === 413 ? "too_large" : "http", status: r.status};
  ghPreview[path] = URL.createObjectURL(blob);
  return path;
}
async function ghWrite(data){
  for (let attempt = 0; attempt < 3; attempt++){
    const sha = await ghSha();
    const body = {message: "Правка сайта через редактор", content: ghB64(JSON.stringify(data)), branch: ghCfg.branch};
    if (sha) body.sha = sha;
    const r = await fetch(ghUrl(), {method: "PUT", headers: ghHeaders({"Accept": "application/vnd.github+json", "Content-Type": "application/json"}), body: JSON.stringify(body)});
    if (r.ok) return;
    if (r.status === 409 || r.status === 422) continue;   // кто-то записал между чтением и записью: пробуем ещё раз
    throw {code: r.status === 401 || r.status === 403 || r.status === 404 ? "not_granted" : "http", status: r.status};
  }
  throw {code: "http", status: 409};
}
function ghStart(){
  contentDoc = {set: data => ghWrite(data)};
  noRights = false; assetsApi = null;
  mountEditor();
  window.addEventListener("beforeunload", e => { if (dirty && !noRights){ saveNow(); e.preventDefault(); e.returnValue = ""; } });
}
async function ghInit(){
  let cfg = null;
  try{ cfg = JSON.parse(localStorage.getItem(GHKEY) || "null"); }catch(e){}
  if (cfg && cfg.token && cfg.repo){
    ghCfg = cfg;
    try{
      const d = await ghRead();
      if (d && !keepLocal){ C = normalize(d); cache(); renderAll(); }
    }catch(e){ if (e && e.code === "not_granted"){ toast("Токен больше не подходит. Войдите заново: слово admin в поиске."); ghCfg = null; try{ localStorage.removeItem(GHKEY); }catch(_){} } }
    if (ghCfg) ghStart();
    return;
  }
  /* обычный посетитель: берём общий файл из репозитория */
  try{
    /* свежая версия напрямую от GitHub (Pages обновляется с задержкой); если не вышло — файл с сайта */
    let d = null;
    const repo = ghGuess();
    if (repo){
      try{
        const r0 = await fetch("https://api.github.com/repos/" + repo + "/contents/" + GH_FILE + "?t=" + Date.now(), {headers: {"Accept": "application/vnd.github.raw+json"}, cache: "no-store"});
        if (r0.ok) d = await r0.json();
      }catch(e){}
    }
    if (!d){
      const r = await fetch(GH_FILE + "?t=" + Date.now(), {cache: "no-store"});
      if (r.ok) d = await r.json();
    }
    if (d && !keepLocal){ C = normalize(d); renderAll(); }
  }catch(e){}
  if (/[?&]edit(=|&|$)/.test(location.search)) ghLogin();
}
function ghLogout(){
  try{ localStorage.removeItem(GHKEY); localStorage.removeItem(CACHE); }catch(e){}
  location.href = location.pathname;
}
/* Запертый токен: строка из seal.html (salt|iv|шифр, base64). Пароль открывает её только в браузере; пусто — вход по токену вручную. */
const GH_SEALED = "npVB5KHp1UbRFuWwQxp03VWtpNreWW1Jji3QG67QI97EUd5P0OMs5BAf1mvOT/0V0SD91fL38OdrwwRuB2nUp7/+FWxD4Vnz7aESAYVYypoQp2Ryx5vy7ZLM1qYfczJoL3aQzLuR7f+BIyqJePuTHwiG87lEpfJ4j4S8iO67d1caHljc4xBpefVC9gKzrwpM7PwV3OopHg/H+ZOdbfuPl84ORlxogQeErXugxDY2+YJbpYEhFg0cfjji5qnS3VfbYg==";
const b64u = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function ghUnseal(pass){
  const raw = b64u(GH_SEALED), salt = raw.slice(0, 16), iv = raw.slice(16, 28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, raw.slice(28))));
}
function ghLoginPass(){
  const pass = h("input", {type: "password", placeholder: "Пароль", autocomplete: "current-password", spellcheck: "false"});
  const msg = h("p", {class: "gh-msg"});
  const ok = h("button", {class: "imgbtn", type: "button"}, "Войти");
  const no = h("button", {class: "imgbtn soft", type: "button"}, "Закрыть");
  const box = h("div", {class: "gh-box", role: "dialog", "aria-label": "Вход для админов"},
    h("div", {class: "gh-in"}, h("h3", {}, "Вход для админов"), h("label", {}, "Пароль", pass), msg, h("div", {class: "gh-row"}, ok, no)));
  const close = () => box.remove();
  no.onclick = close;
  box.addEventListener("click", e => { if (e.target === box) close(); });
  const go = async () => {
    if (!pass.value) return;
    msg.textContent = "Проверяю…"; ok.disabled = true;
    try{
      let cfg;
      try{ cfg = await ghUnseal(pass.value); }catch(e){ throw {status: "pass"}; }
      ghCfg = cfg;
      const r = await fetch("https://api.github.com/repos/" + cfg.repo, {headers: ghHeaders({"Accept": "application/vnd.github+json"})});
      if (!r.ok) throw {status: r.status};
      localStorage.setItem(GHKEY, JSON.stringify(cfg));
      let d = null; try{ d = await ghRead(); }catch(e){}
      if (d && !keepLocal){ C = normalize(d); cache(); }
      close(); ghStart(); renderAll(); toast("Вы вошли. Нажмите «Редактировать» внизу справа.");
    }catch(e){
      ghCfg = null; ok.disabled = false;
      msg.textContent = e && e.status === "pass" ? "Пароль не подошёл."
        : e && e.status === 401 ? "Пароль верный, но токен внутри не подошёл (ошибка в токене или истёк срок). Нужен новый токен."
        : e && (e.status === 403 || e.status === 404) ? "Пароль верный, но у токена нет доступа к репозиторию (код " + e.status + ")."
        : "Не получилось войти (" + ((e && (e.status || e.message)) || "нет связи") + "). Проверьте интернет и попробуйте ещё раз.";
    }
  };
  ok.onclick = go;
  pass.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  document.body.append(box); pass.focus();
}
function ghLogin(){
  if ($(".gh-box")) return;
  if (GH_SEALED) return ghLoginPass();
  const repo = h("input", {type: "text", value: (ghCfg && ghCfg.repo) || ghGuess(), placeholder: "логин/репозиторий", autocomplete: "off", spellcheck: "false"});
  const branch = h("input", {type: "text", value: (ghCfg && ghCfg.branch) || "main", autocomplete: "off", spellcheck: "false"});
  const token = h("input", {type: "password", placeholder: "github_pat_…", autocomplete: "off", spellcheck: "false"});
  const msg = h("p", {class: "gh-msg"});
  const ok = h("button", {class: "imgbtn", type: "button"}, "Войти");
  const no = h("button", {class: "imgbtn soft", type: "button"}, "Закрыть");
  const box = h("div", {class: "gh-box", role: "dialog", "aria-label": "Вход для админов"},
    h("div", {class: "gh-in"},
      h("h3", {}, "Вход для админов"),
      h("p", {class: "gh-n"}, "Токен хранится только в этом браузере. Нужен токен GitHub с правом «Contents: Read and write» на этот репозиторий."),
      h("label", {}, "Репозиторий", repo), h("label", {}, "Ветка", branch), h("label", {}, "Токен", token), msg,
      h("div", {class: "gh-row"}, ok, no)));
  const close = () => box.remove();
  no.onclick = close;
  box.addEventListener("click", e => { if (e.target === box) close(); });
  ok.onclick = async () => {
    const cfg = {repo: repo.value.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\/+$/, ""), branch: branch.value.trim() || "main", token: token.value.trim()};
    if (!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo) || !cfg.token){ msg.textContent = "Заполните репозиторий и токен."; return; }
    msg.textContent = "Проверяю…"; ok.disabled = true;
    try{
      ghCfg = cfg;
      const r = await fetch("https://api.github.com/repos/" + cfg.repo, {headers: ghHeaders({"Accept": "application/vnd.github+json"})});
      if (!r.ok) throw {status: r.status};
      const info = await r.json();
      if (info.permissions && info.permissions.push === false) throw {status: 403, noPush: true};
      localStorage.setItem(GHKEY, JSON.stringify(cfg));
      let d = null; try{ d = await ghRead(); }catch(e){}
      if (d && !keepLocal){ C = normalize(d); cache(); }
      close(); ghStart(); renderAll(); toast("Вы вошли. Нажмите «Редактировать» внизу справа.");
    }catch(e){
      ghCfg = null; ok.disabled = false;
      msg.textContent = e && e.noPush ? "У этого токена нет права записи в репозиторий."
        : e && e.status === 401 ? "Токен не подошёл."
        : e && e.status === 404 ? "Репозиторий не найден: проверьте название и права токена."
        : "Не получилось войти. Проверьте интернет и данные.";
    }
  };
  document.body.append(box); repo.value ? token.focus() : repo.focus();
}

/* Файл открыт с компьютера (или на хостинге с ?edit в адресе) — редактор без хранилища */
if (!(window.claude && window.claude.use) && !/^https?:$/.test(location.protocol)) mountEditor();
